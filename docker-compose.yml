version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ucopet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ucopetdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 11ospinarroyave
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ucopetdb"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: ucopet-postgres-data
