
# Conexion a RabbitMQ

#Transfers
# crear y actualizar
inventory.transfer.save.exchange-name=ucopet.inventory.transfer.save.ex
inventory.transfer.save.queue-name=ucopet.inventory.transfer.save.qu
inventory.transfer.save.routing-key-name=ucopet.inventory.transfer.save.rk
# cambiar estado
inventory.transfer.status.exchange-name=ucopet.inventory.transfer.status.ex
inventory.transfer.status.queue-name=ucopet.inventory.transfer.status.qu
inventory.transfer.status.routing-key-name=ucopet.inventory.transfer.status.rk
# cancelar
inventory.transfer.cancel.exchange-name=ucopet.inventory.transfer.cancel.ex
inventory.transfer.cancel.queue-name=ucopet.inventory.transfer.cancel.qu
inventory.transfer.cancel.routing-key-name=ucopet.inventory.transfer.cancel.rk

# headquarter
# create and update
inventory.headquarter.save.exchange-name=ucopet.inventory.headquarter.save.ex
inventory.headquarter.save.queue-name=ucopet.inventory.headquarter.save.qu
inventory.headquarter.save.routing-key-name=ucopet.inventory.headquarter.save.rk

# headquarter
# deactivate
inventory.headquarter.deactivate.exchange-name=ucopet.inventory.headquarter.deactivate.ex
inventory.headquarter.deactivate.queue-name=ucopet.inventory.headquarter.deactivate.qu
inventory.headquarter.deactivate.routing-key-name=ucopet.inventory.headquarter.deactivate.rk